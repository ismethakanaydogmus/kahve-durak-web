services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kahvedurak
      POSTGRES_USER: kahvedurak
      POSTGRES_PASSWORD: kahvedurak
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kahvedurak -d kahvedurak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
