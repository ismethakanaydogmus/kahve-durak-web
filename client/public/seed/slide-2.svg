<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3e6b48"/>
      <stop offset="1" stop-color="#2e160b"/>
    </linearGradient>
    <linearGradient id="brew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c27a2c"/>
      <stop offset="0.35" stop-color="#7a3f20"/>
      <stop offset="1" stop-color="#43200f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffaf4" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#fffaf4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fffaf4" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- light circles -->
  <g fill="#fbf1e6" opacity="0.08">
    <circle cx="1350" cy="160" r="220"/>
    <circle cx="900" cy="760" r="160"/>
  </g>
  <g transform="translate(-110 0)">
  <!-- glass -->
  <path d="M990 230h330l-34 560c-2 30-26 50-56 50h-150c-30 0-54-20-56-50z" fill="url(#brew)"/>
  <!-- foam layer -->
  <path d="M996 300h318l-4 70H1000z" fill="#f4d9bc" opacity="0.9"/>
  <!-- ice cubes -->
  <g fill="#fffaf4" opacity="0.45" stroke="#fffaf4" stroke-width="4" stroke-opacity="0.7">
    <rect x="1040" y="250" width="90" height="90" rx="14" transform="rotate(-12 1085 295)"/>
    <rect x="1170" y="260" width="95" height="95" rx="14" transform="rotate(10 1217 307)"/>
    <rect x="1090" y="420" width="85" height="85" rx="14" transform="rotate(18 1132 462)"/>
    <rect x="1190" y="500" width="80" height="80" rx="14" transform="rotate(-8 1230 540)"/>
  </g>
  <path d="M990 230h330l-34 560c-2 30-26 50-56 50h-150c-30 0-54-20-56-50z" fill="url(#glass)" stroke="#fffaf4" stroke-width="8" stroke-opacity="0.6"/>
  <!-- straw -->
  <path d="M1230 120l-60 600" stroke="#c27a2c" stroke-width="26" stroke-linecap="round"/>
  <path d="M1230 120l-8 80" stroke="#fffaf4" stroke-width="26" stroke-linecap="round" opacity="0.5"/>
  <!-- droplets -->
  <g fill="#fffaf4" opacity="0.6">
    <ellipse cx="1012" cy="420" rx="7" ry="11"/>
    <ellipse cx="1300" cy="380" rx="6" ry="10"/>
    <ellipse cx="1028" cy="600" rx="6" ry="10"/>
    <ellipse cx="1284" cy="650" rx="7" ry="11"/>
  </g>
  </g>
  <!-- coaster -->
  <ellipse cx="1045" cy="850" rx="230" ry="26" fill="#2e160b" opacity="0.5"/>
</svg>
