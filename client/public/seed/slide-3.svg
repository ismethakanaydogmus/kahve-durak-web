<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d9bc"/>
      <stop offset="1" stop-color="#e9c49b"/>
    </linearGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 60h120M60 0v120" stroke="#c27a2c" stroke-width="3" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <!-- water (Bosphorus-like strip) -->
  <path d="M1600 0v260c-140 40-220 140-330 160S1060 380 980 460 900 700 760 900H1600z" fill="#3e6b48" opacity="0.18"/>
  <!-- streets -->
  <g fill="none" stroke="#fffaf4" stroke-width="26" stroke-linecap="round">
    <path d="M700 820c120-90 160-200 300-240s260 40 360-60"/>
  </g>
  <!-- route -->
  <path d="M760 760c120-80 170-180 290-210s250 20 330-60" fill="none" stroke="#c27a2c" stroke-width="12" stroke-dasharray="4 28" stroke-linecap="round"/>
  <!-- start: shop pin -->
  <g transform="translate(760 760)">
    <circle r="46" fill="#5a2a17"/>
    <path d="M-20 -6h32v10a14 14 0 0 1-14 14h-4a14 14 0 0 1-14-14z" fill="none" stroke="#f4d9bc" stroke-width="6"/>
    <path d="M12 -2h5a7 7 0 0 1 0 14h-6" fill="none" stroke="#f4d9bc" stroke-width="6"/>
  </g>
  <!-- end: home pin -->
  <g transform="translate(1380 490)">
    <path d="M0 70C-40 20-70-10-70-50a70 70 0 0 1 140 0c0 40-30 70-70 120z" fill="#c27a2c"/>
    <path d="M-30-40l30-26 30 26v36h-60z" fill="#fffaf4"/>
    <rect x="-9" y="-24" width="18" height="20" fill="#c27a2c"/>
  </g>
  <!-- delivery bag -->
  <g transform="translate(1050 610)">
    <ellipse cx="0" cy="150" rx="150" ry="18" fill="#5a2a17" opacity="0.2"/>
    <path d="M-120 -40h240l-20 190h-200z" fill="#5a2a17"/>
    <path d="M-60 -40v-30a60 60 0 0 1 120 0v30" fill="none" stroke="#43200f" stroke-width="16" stroke-linecap="round"/>
    <path d="M-40 40h56v24a24 24 0 0 1-24 24h-8a24 24 0 0 1-24-24z" fill="none" stroke="#f4d9bc" stroke-width="9"/>
    <path d="M16 48h8a14 14 0 0 1 0 28h-10" fill="none" stroke="#f4d9bc" stroke-width="9"/>
    <path d="M-24 10c-8 10 8 14 0 24M0 10c-8 10 8 14 0 24" fill="none" stroke="#c27a2c" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
